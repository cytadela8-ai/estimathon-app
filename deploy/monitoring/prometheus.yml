# Five-second sampling; the connection endpoint is enabled only by the monitoring overlay.
global:
  scrape_interval: 5s
  scrape_timeout: 3s
  evaluation_interval: 5s

scrape_configs:
  - job_name: caddy
    static_configs:
      - targets: ['caddy:9180']
  - job_name: estymathon
    metrics_path: /internal/metrics
    static_configs:
      - targets: ['app:3000']
